name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake svg
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: naclaragsd
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF6FAE&color_dots=%231A0510,%234A0D2E,%238B1A4A,%239B2355,%23C4547A

      - name: Push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
